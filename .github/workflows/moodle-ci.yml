name: Moodle Plugin CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  MOODLE_CI: '^4'
  COMPOSER_PROCESS_TIMEOUT: 0
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_NO_AUDIT: 1

jobs:
  lint-php:
    name: "PHP Lint – ${{ matrix.php }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: PHP CodeSniffer
        run: moodle-plugin-ci phpcs plugin

      - name: PHP Copy/Paste Detector
        run: moodle-plugin-ci phpcpd plugin || true

      - name: PHP Mess Detector
        run: moodle-plugin-ci phpmd plugin || true

  lint-js:
    name: "JS/CSS Lint"
    runs-on: ubuntu-24.04

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install required locale
        run: |
          sudo locale-gen en_AU.UTF-8
          sudo update-locale

      # qtype_stack is a declared dependency of this plugin. Even JS lint uses
      # moodle-plugin-ci install to get a Moodle tree, so Maxima must be present
      # before any qtype_stack test-site initialisation can happen.
      # Maxima must be installed before moodle-plugin-ci install:
      # qtype_stack calls Maxima during PHPUnit/Behat test-site initialisation.
      - name: Install Maxima and gnuplot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y maxima gnuplot
          VER=$(maxima --version 2>&1 | grep -oP '\d+\.\d+(\.[0-9]+)?' | head -1)
          echo "Installed Maxima $VER"
          python3 -c "
          v = tuple(int(x) for x in '${VER}'.split('.'))
          assert v >= (5, 46), f'Maxima {v} < required (5, 46)'
          print(f'Maxima {v}: OK')
          "
          command -v gnuplot
          gnuplot --version

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Set TRAVIS_BRANCH for moodle-plugin-ci
        run: |
          BRANCH_NAME=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH_NAME:-default-branch}" >> "$GITHUB_ENV"

      - name: Register qtype_stack
        run: moodle-plugin-ci add-plugin --branch master maths/moodle-qtype_stack

      # JS/CSS linting does not need PHPUnit or Behat initialisation. Using
      # --no-init prevents admin/tool/behat/cli/util_single_run.php --install
      # from being run in this job, avoiding STACK/Maxima side effects here.
      - name: Install Moodle for Grunt only
        run: |
          moodle-plugin-ci install \
            --plugin   ./plugin \
            --db-type  mariadb \
            --db-host  127.0.0.1 \
            --db-port  3306 \
            --db-user  root \
            --db-pass  root \
            --db-name  moodle \
            --branch   MOODLE_405_STABLE \
            --no-init

      - name: Install Node dependencies
        run: npm install
        working-directory: ${{ github.workspace }}/moodle

      - name: ESLint – AMD JS
        run: moodle-plugin-ci grunt -m "$GITHUB_WORKSPACE/moodle" -t eslint

      - name: Stylelint – CSS
        run: moodle-plugin-ci grunt -m "$GITHUB_WORKSPACE/moodle" -t stylelint
        continue-on-error: true

      - name: Verify AMD build artefacts
        run: |
          MISSING=0
          for src in plugin/amd/src/*.js; do
            [ -f "$src" ] || continue
            base=$(basename "$src" .js)
            [ -f "plugin/amd/build/${base}.min.js" ] || {
              echo "MISSING: amd/build/${base}.min.js"
              MISSING=$((MISSING+1))
            }
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "ERROR: $MISSING AMD build file(s) missing – run 'grunt amd'."
            exit 1
          fi
          echo "AMD build OK."

  phpunit:
    name: "PHPUnit (${{ matrix.moodle }} / PHP ${{ matrix.php }} / ${{ matrix.db.engine }})"
    runs-on: ubuntu-24.04
    needs: [lint-php]
    strategy:
      fail-fast: false
      matrix:
        moodle: ['MOODLE_405_STABLE', 'MOODLE_500_STABLE', 'MOODLE_501_STABLE', 'MOODLE_502_STABLE']
        php: ['8.2', '8.3', '8.4']
        db:
          - { engine: mariadb, type: mariadb, port: 3306, user: root, pass: root }
          - { engine: pgsql, type: pgsql, port: 5432, user: moodle, pass: moodle }
        exclude:
          - { moodle: MOODLE_405_STABLE, php: '8.4' }
          - { moodle: MOODLE_500_STABLE, php: '8.4' }
          - { moodle: MOODLE_502_STABLE, php: '8.2' }

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      pgsql:
        image: postgres:16
        env:
          POSTGRES_USER: moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U moodle"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, pdo_pgsql, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install required locale
        run: |
          sudo locale-gen en_AU.UTF-8
          sudo update-locale

      # Maxima must be installed before moodle-plugin-ci install:
      # qtype_stack calls Maxima during PHPUnit/Behat test-site initialisation.
      - name: Install Maxima and gnuplot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y maxima gnuplot
          VER=$(maxima --version 2>&1 | grep -oP '\d+\.\d+(\.[0-9]+)?' | head -1)
          echo "Installed Maxima $VER"
          python3 -c "
          v = tuple(int(x) for x in '${VER}'.split('.'))
          assert v >= (5, 46), f'Maxima {v} < required (5, 46)'
          print(f'Maxima {v}: OK')
          "
          command -v gnuplot
          gnuplot --version

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Set TRAVIS_BRANCH for moodle-plugin-ci
        run: |
          BRANCH_NAME=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH_NAME:-default-branch}" >> "$GITHUB_ENV"

      - name: Register qtype_stack
        run: moodle-plugin-ci add-plugin --branch master maths/moodle-qtype_stack

      - name: Install Moodle ${{ matrix.moodle }}
        run: |
          moodle-plugin-ci install \
            --plugin   ./plugin \
            --db-type  ${{ matrix.db.type }} \
            --db-host  127.0.0.1 \
            --db-port  ${{ matrix.db.port }} \
            --db-user  ${{ matrix.db.user }} \
            --db-pass  ${{ matrix.db.pass }} \
            --db-name  moodle \
            --branch   ${{ matrix.moodle }}


      - name: PHPUnit – all tests
        run: moodle-plugin-ci phpunit

  behat:
    name: "Behat (${{ matrix.moodle }} / PHP ${{ matrix.php }} / Chrome)"
    runs-on: ubuntu-24.04
    needs: [lint-php, lint-js]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { moodle: MOODLE_405_STABLE, php: '8.2' }
          - { moodle: MOODLE_500_STABLE, php: '8.2' }
          - { moodle: MOODLE_501_STABLE, php: '8.2' }
          - { moodle: MOODLE_502_STABLE, php: '8.3' }

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install required locale
        run: |
          sudo locale-gen en_AU.UTF-8
          sudo update-locale

      # Must run before moodle-plugin-ci install. qtype_stack auto-runs
      # Maxima during PHPUnit/Behat test-site installation.
      # Maxima must be installed before moodle-plugin-ci install:
      # qtype_stack calls Maxima during PHPUnit/Behat test-site initialisation.
      - name: Install Maxima and gnuplot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y maxima gnuplot
          VER=$(maxima --version 2>&1 | grep -oP '\d+\.\d+(\.[0-9]+)?' | head -1)
          echo "Installed Maxima $VER"
          python3 -c "
          v = tuple(int(x) for x in '${VER}'.split('.'))
          assert v >= (5, 46), f'Maxima {v} < required (5, 46)'
          print(f'Maxima {v}: OK')
          "
          command -v gnuplot
          gnuplot --version

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Set TRAVIS_BRANCH for moodle-plugin-ci
        run: |
          BRANCH_NAME=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH_NAME:-default-branch}" >> "$GITHUB_ENV"

      - name: Register qtype_stack
        run: moodle-plugin-ci add-plugin --branch master maths/moodle-qtype_stack

      # STACK requires adaptivemultipart behaviour for quiz attempts.
      - name: Register qbehaviour_adaptivemultipart
        run: moodle-plugin-ci add-plugin --branch master maths/moodle-qbehaviour_adaptivemultipart

      - name: Install Moodle ${{ matrix.moodle }}
        run: |
          moodle-plugin-ci install \
            --plugin   ./plugin \
            --db-type  mariadb \
            --db-host  127.0.0.1 \
            --db-port  3306 \
            --db-user  root \
            --db-pass  root \
            --db-name  moodle \
            --branch   ${{ matrix.moodle }}

      # Run in BEHAT_UTIL context: switches Moodle to behat DB + behat dataroot.
      # This ensures maximalocal.mac is written to the correct behat dataroot
      # and STACK CAS uses the correct config (platform=linux, castimeout=300).
      - name: Initialise STACK CAS for Behat
        working-directory: ${{ github.workspace }}/moodle
        run: |
          php - << 'PHP'
          <?php
          define('BEHAT_UTIL', true);
          define('CLI_SCRIPT', true);
          require_once(getcwd() . '/config.php');
          global $CFG, $DB;
          if (!$DB->get_manager()->table_exists('config')) {
              fwrite(STDERR, "Behat DB has no {config} table.\n");
              exit(1);
          }
          $stackroot = $CFG->dirroot . '/question/type/stack';
          if (!file_exists($stackroot . '/stack/cas/installhelper.class.php')) {
              fwrite(STDERR, "qtype_stack not found at {$stackroot}.\n");
              exit(1);
          }
          require_once($stackroot . '/stack/cas/installhelper.class.php');
          set_config('platform',        'linux',   'qtype_stack');
          set_config('maximacommand',   'maxima',  'qtype_stack');
          set_config('maximaversion',   'default', 'qtype_stack');
          set_config('castimeout',      '300',     'qtype_stack');
          set_config('casresultscache', 'db',      'qtype_stack');
          purge_all_caches();
          stack_cas_configuration::create_maximalocal();
          echo 'STACK maximalocal.mac created in: ' . $CFG->dataroot . PHP_EOL;
          echo 'STACK platform: ' . get_config('qtype_stack', 'platform') . PHP_EOL;
          PHP

      - name: Behat – all plugin scenarios
        run: |
          set -o pipefail
          moodle-plugin-ci behat \
            --profile chrome \
            --start-servers \
            --auto-rerun 0 \
            --tags "@local_stackmatheditor&&~@broken" \
            2>&1 | tee behat.log

      - name: Show relevant Behat failures
        if: failure()
        run: |
          echo "===== Behat failure summary ====="
          grep -n -E 'Scenario:|Step:|Exception|Error|Failed|Coding error|Moodle exception|stack_cas_connection|Fatal error|Table.*does not exist|Unknown column|Stack trace|Css matching locator|not found|does not equal' behat.log || true

      - name: Search for screenshot/faildump files
        if: failure()
        run: |
          echo "=== Searching for screenshot/faildump files ==="
          find "$GITHUB_WORKSPACE" -type f \( -name '*.png' -o -name '*.html' \) \
            | grep -E 'behat_dump|behat_faildump' \
            | head -200 || true
          echo "=== Contents of moodledata/ ==="
          ls -la "$GITHUB_WORKSPACE/moodledata" || true

      - name: Upload Behat faildump
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: behat-faildump-${{ matrix.moodle }}
          path: |
            ${{ github.workspace }}/moodledata/behat_dump/**
            ${{ github.workspace }}/moodledata/behat_faildump/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Behat log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behat-log-${{ matrix.moodle }}
          path: behat.log
          if-no-files-found: ignore
          retention-days: 7
