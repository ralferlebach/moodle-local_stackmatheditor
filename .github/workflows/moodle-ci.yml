##############################################################################
# GitHub Actions CI – block_coursectrldates (Course Dates Block)
#
# Matrix:
#   Moodle:  4.5, 5.0, 5.1, 5.2
#   PHP:     8.1, 8.2, 8.3, 8.4  (with version-appropriate exclusions)
#   DB:      MariaDB 10.11  |  PostgreSQL 16
#
# Dependency:
#   local_coursectrl (Course Control Hub) is cloned from the main branch
#   of ralferlebach/moodle-local_coursectrl and installed as an extra plugin
#   before PHPUnit / Behat initialisation.
##############################################################################

name: Moodle Plugin CI

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches-ignore:
      - main

env:
  MOODLE_CI: '^4'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PGPASSWORD: postgres

jobs:

  # ── 1a. PHP Lint ──────────────────────────────────────────────────────────
  lint-php:
    name: "PHP Lint – ${{ matrix.php }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: PHP CodeSniffer (Moodle coding style)
        run: moodle-plugin-ci phpcs plugin

      - name: PHP Mess Detector
        run: moodle-plugin-ci phpmd plugin || true

  # ── 1b. JS / CSS Lint ─────────────────────────────────────────────────────
  lint-js:
    name: "JS/CSS/Mustache Lint"
    runs-on: ubuntu-24.04

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        run: |
          sudo locale-gen en_AU.UTF-8
          sudo update-locale

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH_NAME=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH_NAME:-main}" >> "$GITHUB_ENV"

      - name: Install Moodle 4.5 (grunt baseline)
        run: |
          moodle-plugin-ci install \
            --plugin  ./plugin \
            --branch  MOODLE_405_STABLE \
            --db-type mariadb \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --db-user root \
            --db-pass root \
            --db-name moodle \
            --no-init

      - name: Clone and install local_coursectrl dependency
        run: |
          MOODLE_DIR=$([ -d "${{ github.workspace }}/moodle/public" ] \
            && echo "${{ github.workspace }}/moodle/public" \
            || echo "${{ github.workspace }}/moodle")
          git clone --depth=1 --branch main \
            https://github.com/ralferlebach/moodle-local_coursectrl.git \
            "$MOODLE_DIR/local/coursectrl"

      - name: Install Node dependencies
        run: npm install
        working-directory: ${{ github.workspace }}/moodle

      - name: ESLint – AMD JS
        run: moodle-plugin-ci grunt -m "$GITHUB_WORKSPACE/moodle" -t eslint

      - name: Stylelint – CSS
        run: moodle-plugin-ci grunt -m "$GITHUB_WORKSPACE/moodle" -t stylelint
        continue-on-error: true

      - name: Verify AMD build artefacts are up to date
        run: |
          if ! ls plugin/amd/src/*.js 2>/dev/null | grep -q .; then
            echo "No AMD source files — skipping."; exit 0
          fi
          MISSING=0
          for src in plugin/amd/src/*.js; do
            base=$(basename "$src" .js)
            [ -f "plugin/amd/build/${base}.min.js" ] || {
              echo "MISSING: $base.min.js"; MISSING=$((MISSING+1))
            }
          done
          [ "$MISSING" -eq 0 ] && echo "AMD OK." \
            || { echo "ERROR: $MISSING file(s) missing."; exit 1; }

      - name: PHPDoc check
        run: moodle-plugin-ci phpdoc
        env:
          IGNORE_PATHS: tools

      - name: Mustache lint
        run: moodle-plugin-ci mustache

  # ── 2. PHPUnit ────────────────────────────────────────────────────────────
  phpunit:
    name: "PHPUnit (${{ matrix.moodle }} / PHP ${{ matrix.php }} / ${{ matrix.db.engine }})"
    runs-on: ubuntu-24.04
    needs: [lint-php, lint-js]
    strategy:
      fail-fast: false
      matrix:
        moodle:
          - MOODLE_405_STABLE
          - MOODLE_500_STABLE
          - MOODLE_501_STABLE
          - MOODLE_502_STABLE
        php: ['8.1', '8.2', '8.3', '8.4']
        db:
          - { engine: mariadb, type: mariadb, port: 3306, user: root,   pass: root   }
          - { engine: pgsql,   type: pgsql,   port: 5432, user: moodle, pass: moodle }
        exclude:
          # Moodle 4.5 supports PHP 8.1–8.3 only.
          - { moodle: MOODLE_405_STABLE, php: '8.4' }
          # Moodle 5.0+ requires PHP 8.2+.
          - { moodle: MOODLE_500_STABLE, php: '8.1' }
          - { moodle: MOODLE_501_STABLE, php: '8.1' }
          - { moodle: MOODLE_502_STABLE, php: '8.1' }
          # Moodle 5.2 requires PHP 8.3+.
          - { moodle: MOODLE_502_STABLE, php: '8.2' }
          # Moodle 5.0 PHP 8.4 support — conservative, align with local_coursectrl.
          - { moodle: MOODLE_500_STABLE, php: '8.4' }

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      pgsql:
        image: postgres:16
        env:
          POSTGRES_USER:     moodle
          POSTGRES_PASSWORD: moodle
          POSTGRES_DB:       postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U moodle"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_mysql, pdo_pgsql, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        run: |
          sudo locale-gen en_AU.UTF-8
          sudo update-locale

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH_NAME=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH_NAME:-main}" >> "$GITHUB_ENV"

      - name: Install Moodle ${{ matrix.moodle }}
        run: |
          moodle-plugin-ci install \
            --plugin  ./plugin \
            --branch  ${{ matrix.moodle }} \
            --db-type ${{ matrix.db.type }} \
            --db-host 127.0.0.1 \
            --db-port ${{ matrix.db.port }} \
            --db-user ${{ matrix.db.user }} \
            --db-pass ${{ matrix.db.pass }} \
            --db-name moodle

      - name: Clone and install local_coursectrl dependency
        run: |
          MOODLE_DIR=$([ -d "${{ github.workspace }}/moodle/public" ] \
            && echo "${{ github.workspace }}/moodle/public" \
            || echo "${{ github.workspace }}/moodle")
          git clone --depth=1 --branch main \
            https://github.com/ralferlebach/moodle-local_coursectrl.git \
            "$MOODLE_DIR/local/coursectrl"
          cd "$MOODLE_DIR" && php admin/tool/phpunit/cli/init.php

      - name: PHPUnit – all tests
        run: moodle-plugin-ci phpunit --fail-on-warning

  # ── 3. Behat ──────────────────────────────────────────────────────────────
  behat:
    name: "Behat (${{ matrix.moodle }} / PHP 8.2 / Chrome)"
    runs-on: ubuntu-24.04
    needs: [lint-php, lint-js]
    strategy:
      fail-fast: false
      matrix:
        moodle:
          - MOODLE_405_STABLE
          - MOODLE_500_STABLE
          - MOODLE_501_STABLE

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, gd, xml, zip, intl
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install en_AU.UTF-8 locale
        run: |
          sudo locale-gen en_AU.UTF-8
          sudo update-locale

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev moodlehq/moodle-plugin-ci ci ${{ env.MOODLE_CI }}
          echo "$GITHUB_WORKSPACE/ci/bin"        >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Set TRAVIS_BRANCH
        run: |
          BRANCH_NAME=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
          echo "TRAVIS_BRANCH=${BRANCH_NAME:-main}" >> "$GITHUB_ENV"

      - name: Install Moodle ${{ matrix.moodle }}
        run: |
          moodle-plugin-ci install \
            --plugin  ./plugin \
            --branch  ${{ matrix.moodle }} \
            --db-type mariadb \
            --db-host 127.0.0.1 \
            --db-port 3306 \
            --db-user root \
            --db-pass root \
            --db-name moodle

      - name: Clone and install local_coursectrl dependency
        run: |
          MOODLE_DIR=$([ -d "${{ github.workspace }}/moodle/public" ] \
            && echo "${{ github.workspace }}/moodle/public" \
            || echo "${{ github.workspace }}/moodle")
          git clone --depth=1 --branch main \
            https://github.com/ralferlebach/moodle-local_coursectrl.git \
            "$MOODLE_DIR/local/coursectrl"
          cd "$MOODLE_DIR" && php admin/tool/behat/cli/init.php

      - name: Behat – all block scenarios
        run: |
          moodle-plugin-ci behat \
            --profile chrome \
            --tags "@block_coursectrldates and not @broken" \
            --start-servers

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: behat-screenshots-${{ matrix.moodle }}
          path: ${{ github.workspace }}/moodle/behatfaildumps/
          retention-days: 7
