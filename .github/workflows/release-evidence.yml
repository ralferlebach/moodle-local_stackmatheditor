# Release evidence for one exact commit (#69).
#
# The main workflow answers "does the code work". This one answers "is this artefact
# releasable": it runs the gates that are otherwise manual - browser, accessibility,
# dependency audit, load smoke - against one SHA that the caller names, and collects the
# result in a single artefact.
#
# Option B of the issue, deliberately: not every check on every push, but no stable release
# without evidence for exactly the artefact that is released.

name: release evidence

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to certify (defaults to the ref this runs on)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0

      - name: Record what is being certified
        run: |
          mkdir -p evidence
          {
            echo "repository: ${{ github.repository }}"
            echo "commit: $(git rev-parse HEAD)"
            echo "commit date: $(git show -s --format=%cI HEAD)"
            echo "workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "started: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "version.php:"
            grep -E '\$plugin->(version|release|maturity)' version.php
            echo ""
            echo "vendored MathQuill:"
            grep -E 'Version:|Upstream base:|Fork commit:' thirdparty/readme_moodle.txt || true
            echo ""
            echo "checksums of the vendored runtime files:"
            sha256sum thirdparty/mathquill/mathquill.js \
                      thirdparty/mathquill/mathquill.min.js \
                      thirdparty/mathquill/mathquill.css
          } | tee evidence/artefact.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Dependency audit
        continue-on-error: true
        run: |
          for dir in tests/jest tests/playwright; do
            if [ -f "$dir/package-lock.json" ]; then
              echo "=== $dir" | tee -a evidence/dependency-audit.txt
              # What would ship: nothing under tests/ is in the release archive, so in practice
              # this is empty - but if a runtime dependency ever appears, this is where it shows.
              (cd "$dir" && npm audit --omit=dev --audit-level=high) \
                2>&1 | tee -a evidence/dependency-audit.txt | tee -a evidence/runtime-audit.txt || true
              echo "--- including dev dependencies (advisory only)" \
                | tee -a evidence/dependency-audit.txt
              (cd "$dir" && npm audit) 2>&1 | tee -a evidence/dependency-audit.txt || true
            fi
          done

      - name: Release artefact
        run: |
          git archive --format=zip --prefix=stackmatheditor/ HEAD \
            -o evidence/stackmatheditor.zip
          unzip -l evidence/stackmatheditor.zip | tee evidence/artefact-contents.txt
          sha256sum evidence/stackmatheditor.zip | tee -a evidence/artefact.txt

      # The gate #69 asks for: the other workflows have to have run on this very commit, and
      # green. A release that cites a Playwright run from three commits ago cites nothing.
      - name: Require the code, browser, screen reader and load runs on this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          missing=0
          {
            echo "required runs for $sha"
            # moodle-plugin-ci-main: code gates across the support matrix, upgrade included.
            # a11y-nvda: started by hand; the screen reader transcripts of this commit.
            for wf in moodle-plugin-ci-main.yml playwright.yml a11y-nvda.yml load-k6.yml load-jmeter.yml; do
              status=$(gh run list --workflow "$wf" --commit "$sha" \
                --json conclusion --jq '.[0].conclusion' 2>/dev/null || true)
              link=$(gh run list --workflow "$wf" --commit "$sha" \
                --json url --jq '.[0].url' 2>/dev/null || true)
              case "$status" in
                success) echo "  $wf: success  $link" ;;
                "")      echo "  $wf: NEVER RAN on this commit"; missing=1 ;;
                *)       echo "  $wf: $status  $link"; missing=1 ;;
              esac
            done
          } | tee evidence/required-runs.txt

          if [ "$missing" -ne 0 ]; then
            echo "::error::A required run is missing or not green for $sha."
            echo "Start the missing workflows on this commit and run this again." \
              | tee -a evidence/required-runs.txt
            exit 1
          fi

      - name: Dependency findings are not advisory here
        run: |
          # The audit above runs with continue-on-error so that the evidence is collected even
          # when it fails. For a release, a high or critical finding is a stop (#69).
          #
          # Only runtime findings stop it. Everything under tests/ is a development tool and is
          # excluded from the release archive; its findings are recorded above and assessed in
          # docs/DEPENDENCY-AUDIT.md, but a DoS in a test runner's glob matcher is not a defect
          # of the plugin a site installs (#69: dev-only advisories are not runtime blockers).
          if grep -qiE '[0-9]+ (high|critical)' evidence/runtime-audit.txt 2>/dev/null; then
            echo "::error::High or critical dependency findings; assess them before releasing."
            exit 1
          fi

      - name: What still needs a human
        run: |
          zipsum=$(sha256sum evidence/stackmatheditor.zip | cut -d' ' -f1)
          {
            echo "Release candidate"
            echo "  commit:          $(git rev-parse HEAD)"
            echo "  archive SHA-256: $zipsum"
            echo "  evidence run:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "Required runs on this commit (all green, links in required-runs.txt):"
            sed -n 's/^  /  /p' evidence/required-runs.txt
            echo ""
            echo "Measured automatically in playwright.yml (a11y-zoom.spec.js), no manual step:"
            echo "  200 and 400 per cent zoom with the core workflow, a narrow viewport,"
            echo "  24 x 24 targets, keyboard reach, visible focus."
            echo ""
            echo "Judgement a workflow cannot make - record it before MATURITY_STABLE:"
            echo ""
            echo "  [ ] NVDA transcripts of the a11y-nvda run read and understandable,"
            echo "      in a sensible order, nothing read twice (docs/MANUAL-ACCEPTANCE.md, section 1)"
            echo "      date: ____  browser: ____  NVDA version: ____  by: ____"
            echo "  [ ] Android devices: first soft-keyboard input in a fresh field in Chrome,"
            echo "      Opera, Firefox, Firefox Klar and with a keyboard other than Gboard"
            echo "      (docs/MANUAL-ACCEPTANCE.md, section 2)"
            echo "      date: ____  devices: ____  by: ____"
            echo "  [ ] Release from this commit only. GitHub releases are made by"
            echo "      release-artefact.yml and guarded by release-guard.yml; the upload to the"
            echo "      Moodle plugins directory is by hand (docs/RELEASE-CHECKLIST.md, section 3):"
            echo "      SHA-256 of the uploaded archive equals the one of the GitHub release."
            echo "      date: ____  SHA-256: ____  by: ____"
            echo "  [ ] Every open P1 closed or accepted with name and date in"
            echo "      docs/RESIDUAL-RISKS.md"
            echo "      date: ____  by: ____"
          } | tee evidence/manual-checklist.txt

      - name: Upload the evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.run_id }}
          path: evidence
          retention-days: 90
          if-no-files-found: warn
